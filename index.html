<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Audio AI Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f2027;
  color: white;
}

.container {
  display: flex;
  height: 100vh;
}

.left {
  width: 40%;
  padding: 20px;
  background: #111;
}

.right {
  width: 60%;
  padding: 20px;
  overflow-y: auto;
}

button {
  padding: 10px;
  background: #00ffcc;
  border: none;
  cursor: pointer;
  width: 100%;
}

pre {
  font-size: 18px;
  line-height: 1.6;
}

.highlight {
  color: #00ffcc;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <h2>🎤 Upload</h2>
    <input type="file" id="audioFile" accept="audio/*"><br><br>

    <button onclick="transcrever()">Transcrever</button><br><br>

    <audio id="player" controls></audio>
  </div>

  <div class="right">
    <h2>📝 Letra</h2>
    <pre id="resultado"></pre>
  </div>

</div>

<script>
let textoGlobal = "";

async function transcrever() {
  const file = document.getElementById("audioFile").files[0];

  if (!file) {
    alert("Selecione um áudio!");
    return;
  }

  // mostrar player
  const url = URL.createObjectURL(file);
  document.getElementById("player").src = url;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("model", "whisper-1");

  const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer SUA_API_KEY_AQUI"
    },
    body: formData
  });

  const data = await response.json();
  textoGlobal = data.text;

  mostrarTexto();
}

function mostrarTexto() {
  const palavras = textoGlobal.split(" ");
  let html = "";

  palavras.forEach(p => {
    html += `<span>${p} </span>`;
  });

  document.getElementById("resultado").innerHTML = html;
}

// simulação de karaokê
document.getElementById("player").addEventListener("timeupdate", () => {
  const spans = document.querySelectorAll("#resultado span");
  const tempo = document.getElementById("player").currentTime;

  const index = Math.floor(tempo * 2); // velocidade do destaque

  spans.forEach((s, i) => {
    s.classList.remove("highlight");
    if (i === index) {
      s.classList.add("highlight");
    }
  });
});
</script>

</body>
</html>
