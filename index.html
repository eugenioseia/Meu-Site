<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio AI Pro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80")
    center/cover no-repeat;
}

/* LOGIN */
#login {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-card {
  width: 330px;
  padding: 28px;
  border-radius: 22px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  text-align: center;
}

.login-card h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 12px;
  border: none;
  border-radius: 12px;
  outline: none;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #00ffcc, #00aaff);
  color: #001;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.02);
}

/* APP */
.container {
  display: flex;
  min-height: 100vh;
  padding: 25px;
  gap: 25px;
}

.left, .right {
  border-radius: 24px;
  padding: 25px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}

.left {
  width: 35%;
}

.right {
  width: 65%;
  overflow-y: auto;
}

h2 {
  margin-top: 0;
}

input[type="file"] {
  background: rgba(255,255,255,0.15);
  color: white;
}

audio {
  width: 100%;
  margin-top: 20px;
}

#resultado {
  line-height: 1.8;
  font-size: 18px;
}

.highlight {
  color: #00ffcc;
  font-weight: bold;
  background: rgba(0,255,204,0.15);
  border-radius: 6px;
  padding: 2px 4px;
}

.logo {
  font-size: 34px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 14px;
  opacity: 0.8;
  text-align: center;
  margin-bottom: 25px;
}

.user-bar {
  margin-bottom: 20px;
  font-size: 14px;
  opacity: 0.9;
}

.logout {
  margin-top: 15px;
  background: rgba(255,255,255,0.15);
  color: white;
}

/* CELULAR */
@media (max-width: 800px) {
  .container {
    flex-direction: column;
  }

  .left, .right {
    width: 100%;
  }

  .login-card {
    width: 90%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="logo">🎧 Audio AI Pro</div>
    <div class="subtitle">Entre para transcrever suas músicas</div>

    <input id="user" placeholder="Usuário ou e-mail">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div class="container" id="app" style="display:none;">

  <div class="left">
    <div class="user-bar">
      Logado como: <span id="nomeUsuario"></span>
    </div>

    <h2>🎤 Upload</h2>

    <input type="file" id="audioFile" accept="audio/*">

    <button onclick="transcrever()">Transcrever</button>

    <audio id="player" controls></audio>

    <button class="logout" onclick="sair()">Sair</button>
  </div>

  <div class="right">
    <h2>📝 Letra</h2>
    <div id="resultado">
      Envie um áudio e clique em transcrever.
    </div>
  </div>

</div>

<script>
let textoGlobal = "";

// LOGIN SIMPLES
function login() {
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();

  if (!user || !pass) {
    alert("Preencha usuário e senha!");
    return;
  }

  localStorage.setItem("user", user);

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("nomeUsuario").textContent = user;
}

// SAIR
function sair() {
  localStorage.removeItem("user");
  document.getElementById("login").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

// MANTER LOGADO
window.onload = function() {
  const user = localStorage.getItem("user");

  if (user) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("nomeUsuario").textContent = user;
  }
};

// TRANSCRIÇÃO
async function transcrever() {
  const file = document.getElementById("audioFile").files[0];

  if (!file) {
    alert("Selecione um áudio!");
    return;
  }

  document.getElementById("player").src = URL.createObjectURL(file);
  document.getElementById("resultado").innerHTML = "⏳ Transcrevendo... aguarde.";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("model", "whisper-1");

  try {
    const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer SUA_API_KEY_AQUI"
      },
      body: formData
    });

    const data = await response.json();

    if (!data.text) {
      alert("Erro na transcrição!");
      console.log(data);
      document.getElementById("resultado").innerHTML = "Erro na transcrição.";
      return;
    }

    textoGlobal = data.text;
    mostrarTexto();

  } catch (err) {
    alert("Erro na API");
    console.error(err);
    document.getElementById("resultado").innerHTML = "Erro ao conectar com a API.";
  }
}

// MOSTRAR TEXTO
function mostrarTexto() {
  const palavras = textoGlobal.split(" ");
  let html = "";

  palavras.forEach(p => {
    html += `<span>${p} </span>`;
  });

  document.getElementById("resultado").innerHTML = html;
}

// KARAOKE SIMPLES
document.getElementById("player").addEventListener("timeupdate", () => {
  const spans = document.querySelectorAll("#resultado span");
  const tempo = document.getElementById("player").currentTime;

  const index = Math.floor(tempo * 2);

  spans.forEach((s, i) => {
    s.classList.remove("highlight");

    if (i === index) {
      s.classList.add("highlight");
    }
  });
});
</script>

</body>
</html>
