<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Audio AI Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

.container {
  display: flex;
  height: 100vh;
}

.left, .right {
  padding: 20px;
}

.left {
  width: 35%;
  background: rgba(0,0,0,0.8);
}

.right {
  width: 65%;
  overflow-y: auto;
}

button {
  padding: 10px;
  background: #00ffcc;
  border: none;
  width: 100%;
  cursor: pointer;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
}

.highlight {
  color: #00ffcc;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>🔐 Criar Conta / Login</h2>
  <input id="user" placeholder="Usuário">
  <input id="pass" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div class="container" id="app" style="display:none;">

  <div class="left">
    <h2>🎤 Upload</h2>
    <input type="file" id="audioFile" accept="audio/*"><br><br>

    <button onclick="transcrever()">Transcrever</button><br><br>

    <audio id="player" controls></audio>
  </div>

  <div class="right">
    <h2>📝 Letra</h2>
    <div id="resultado"></div>
  </div>

</div>

<script>
let textoGlobal = "";

// LOGIN SIMPLES (local)
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  if (!user || !pass) {
    alert("Preencha tudo!");
    return;
  }

  localStorage.setItem("user", user);

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";
}

// TRANSCRIÇÃO
async function transcrever() {
  const file = document.getElementById("audioFile").files[0];

  if (!file) {
    alert("Selecione um áudio!");
    return;
  }

  document.getElementById("player").src = URL.createObjectURL(file);

  const formData = new FormData();
  formData.append("file", file);
  formData.append("model", "whisper-1");

  try {
    const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer SUA_API_KEY_AQUI"
      },
      body: formData
    });

    const data = await response.json();

    if (!data.text) {
      alert("Erro na transcrição!");
      console.log(data);
      return;
    }

    textoGlobal = data.text;
    mostrarTexto();

  } catch (err) {
    alert("Erro na API");
    console.error(err);
  }
}

// MOSTRAR TEXTO
function mostrarTexto() {
  const palavras = textoGlobal.split(" ");
  let html = "";

  palavras.forEach(p => {
    html += `<span>${p} </span>`;
  });

  document.getElementById("resultado").innerHTML = html;
}

// KARAOKE SIMPLES
document.getElementById("player").addEventListener("timeupdate", () => {
  const spans = document.querySelectorAll("#resultado span");
  const tempo = document.getElementById("player").currentTime;

  const index = Math.floor(tempo * 2);

  spans.forEach((s, i) => {
    s.classList.remove("highlight");
    if (i === index) {
      s.classList.add("highlight");
    }
  });
});
</script>

</body>
</html>
