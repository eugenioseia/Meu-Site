<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Audio AI Pro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: white;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1518770660439-4636190af475') no-repeat center center/cover;
      height: 100vh;
    }

    .container {
      background: rgba(0,0,0,0.7);
      padding: 40px;
      border-radius: 10px;
      width: 300px;
      margin: auto;
      margin-top: 100px;
    }

    button {
      padding: 10px;
      border: none;
      background: #00ffcc;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    input {
      padding: 10px;
      width: 100%;
    }

    pre {
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎤 Audio AI</h1>

  <input type="file" id="audioFile" />
  <br><br>

  <button onclick="transcrever()">Transcrever</button>
  <br><br>

  <button onclick="resumir()">Resumir Texto</button>

  <h3>Resultado:</h3>
  <pre id="resultado"></pre>
</div>

<script>
async function transcrever() {
  const file = document.getElementById("audioFile").files[0];

  if (!file) {
    alert("Selecione um áudio!");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("model", "whisper-1");

  const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer SUA_API_KEY_AQUI"
    },
    body: formData
  });

  const data = await response.json();
  document.getElementById("resultado").innerText = data.text;
}

async function resumir() {
  const texto = document.getElementById("resultado").innerText;

  if (!texto) {
    alert("Nenhum texto ainda!");
    return;
  }

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer SUA_API_KEY_AQUI",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: [
        { role: "user", content: "Resuma esse texto: " + texto }
      ]
    })
  });

  const data = await response.json();
  alert(data.choices[0].message.content);
}
</script>

</body>
</html>
