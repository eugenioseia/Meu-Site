<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Transcrição de Áudio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: white;
      text-align: center;
      background: black;
      overflow: hidden;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      margin-top: 100px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #00ffcc;
      cursor: pointer;
      font-size: 16px;
    }

    input {
      padding: 10px;
    }
  </style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">
  <h1>Converter Áudio para Texto</h1>

  <input type="file" id="audioFile" />
  <br><br>
  <button onclick="transcrever()">Transcrever</button>

  <h2>Resultado:</h2>
  <pre id="resultado"></pre>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    size: { value: 3 },
    move: { speed: 2 }
  }
});
</script>

<script>
async function transcrever() {
  const fileInput = document.getElementById("audioFile");
  const file = fileInput.files[0];

  if (!file) {
    alert("Selecione um áudio!");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("model", "whisper-1");

  const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer SUA_API_KEY_AQUI"
    },
    body: formData
  });

  const data = await response.json();
  document.getElementById("resultado").innerText = data.text;
}
</script>

</body>
</html>
